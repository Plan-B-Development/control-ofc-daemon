version: 2

# Scope is deliberately GitHub Actions ONLY.
#
# Every third-party action in this repo is SHA-pinned (a supply-chain requirement,
# not a style choice), which means each one has to be bumped by hand — and nothing
# was watching them. That is the gap this closes.
#
# Cargo dependencies are intentionally NOT managed here: `cargo-deny` runs per-PR
# (DEC-174) with advisories soft-failing and bans/licenses/sources hard-failing,
# which is the check that matters. A Cargo updater would also churn `Cargo.lock`,
# which the PKGBUILD builds `--frozen` against — every such PR would need a
# coordinated lock regeneration to stay releasable.
#
# Grouped and monthly on purpose: one reviewable PR a month rather than a stream
# that each re-runs CI.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
