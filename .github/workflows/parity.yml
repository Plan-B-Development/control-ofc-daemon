name: Parity oracle sync

# The GUI demo-evaluator and the daemon control loop are pinned to a SHARED
# golden file (parity_vectors.json, DEC-126) — one copy in each repo, required
# byte-identical. Each repo's own tests validate against their OWN copy, so a
# drift between the two copies is invisible to single-repo CI (the GUI's
# byte-identity test skips when the daemon repo isn't checked out). This closes
# that hole: whenever THIS repo's copy changes, check out the peer repo and
# assert the two copies are byte-identical. Path-filtered, so unrelated PRs
# never trigger it. control-ofc-gui is public, so the default token can read it.

on:
  pull_request:
    paths: ['daemon/tests/fixtures/parity_vectors.json']
  push:
    branches: [main]
    paths: ['daemon/tests/fixtures/parity_vectors.json']

permissions:
  contents: read

jobs:
  byte-identical:
    name: parity_vectors.json byte-identical with GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: Plan-B-Development/control-ofc-gui
          path: _gui
      - name: Compare oracle copies
        run: |
          cmp daemon/tests/fixtures/parity_vectors.json \
              _gui/tests/fixtures/parity_vectors.json \
            || { echo "::error::parity_vectors.json drifted between the daemon and GUI copies — they must be byte-identical (DEC-126). Update both in lockstep (daemon-first)."; exit 1; }
