<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!--
    Panel/tray glyph for control-ofc-tray.

    Derived from the GUI's brand mark (control-ofc-gui
    assets/branding/app_icon/app_icon.svg). The five-blade rotor and its central
    hub are kept, because those are what make the mark recognisable; the
    rounded-square field, the blue gradients and the four corner screws are
    dropped, because at 22px they become noise.

    Drawn as a disc with five swept slots cut out of it, rather than as five
    free-standing blades. That was not the first attempt: separate blades render
    as convex blobs around a gap, which reads as a FLOWER at panel size no matter
    how the blades are swept — checked by rendering at 16/22/32px rather than by
    eye on the source. Cutting slots instead keeps the outline circular, which is
    the cue that says "fan" immediately, and the swept slots supply the sense of
    rotation.

    Follows the Breeze convention for a recolourable icon: KDE's icon engine
    rewrites `color` in the `current-color-scheme` <style> block to the active
    colour scheme's text colour, and the shape picks it up via
    `fill:currentColor`. That is what makes the glyph light on a dark panel and
    dark on a light one instead of a fixed-colour blob. The #232629 literal is
    only the fallback for a renderer that does not perform the rewrite (it is
    Breeze's own dark-text colour, correct on a light background).
  -->
  <defs id="defs1">
    <style type="text/css" id="current-color-scheme">
      .ColorScheme-Text {
        color:#232629;
      }
    </style>
  </defs>
