# Super-I/O probe guard for control-ofc-daemon (DEC-332).
#
# On a Gigabyte board with an ITE Super-I/O, loading nct6775 or w83627ehf can
# permanently hide a second Super-I/O chip and the fan headers on it, until the
# machine is fully powered down at the wall. Both drivers write a config-mode
# unlock to 0x2E/0x4E before reading the device ID, and that write can latch an
# ITE eSPI-to-LPC bridge into config mode, where it answers in place of the chip
# behind it.
#
# Measured 2026-09-05 on an X870E AORUS MASTER: 3 of 8 fan headers and 3 of 9
# temperatures lost. The module fails to load ("No such device") and does the
# damage anyway, because the write happens before the failure.
#
# The guard suppresses the probe ONLY on boards known to carry an ITE Super-I/O,
# where these Nuvoton/Winbond drivers could never have bound anyway. On every
# other board it runs the real modprobe unchanged — nct6775 is genuinely needed
# on most Nuvoton boards.
#
# `install` and not `blacklist`: systemd-modules-load issues an explicit
# `modprobe <name>`, which ignores blacklist and honours install.
#
# To override, create a file with the SAME NAME in /etc/modprobe.d/:
#     /etc/modprobe.d/control-ofc-superio.conf
# A same-named file in a higher-priority directory masks this one entirely, which
# is the ONLY override modprobe.d(5) guarantees. A DIFFERENTLY-named file in
# /etc/modprobe.d does NOT reliably win: all config files across all directories
# are parsed in lexicographic order by basename, and for a duplicated `install`
# the FIRST one parsed takes effect. Measured with kmod 34.2 -- `10-a.conf` beat
# `90-b.conf` in both orderings -- so an override named e.g. `zz-nct6775.conf`
# would sort after this file and be silently ignored.
#
# Recovering a chip already hidden needs a FULL POWER CUT as well -- see the
# Hardware Troubleshooting guide.
#
# In an initramfs (DEC-414): mkinitcpio's `modconf` hook copies this file into
# every image, but not the guard it names. So each line first checks that the
# guard is there. Where it is not -- only in an initramfs, e.g. with nct6775 in
# mkinitcpio's MODULES= -- nothing is loaded and nothing is probed, on any
# board, and the module loads after boot, where the guard can check the board.
# The line needs a shell to run: with one in the image (mkinitcpio's `base`
# hook provides it) one line says why and the load reports success; an image
# built without `base` has no shell, so there the load fails as it always has
# -- still without probing. Loading the module unguarded instead would run the
# very probe this file exists to stop.

install nct6775 if [ -x /usr/lib/control-ofc/control-ofc-superio-guard ]; then exec /usr/lib/control-ofc/control-ofc-superio-guard nct6775 $CMDLINE_OPTS; else echo 'control-ofc: nct6775 is not loaded in the initramfs, because the Super-I/O guard is not in the image. It loads after boot (the package /etc/modules-load.d/control-ofc.conf asks for it), where the guard can check the board.' >&2; fi
install w83627ehf if [ -x /usr/lib/control-ofc/control-ofc-superio-guard ]; then exec /usr/lib/control-ofc/control-ofc-superio-guard w83627ehf $CMDLINE_OPTS; else echo 'control-ofc: w83627ehf is not loaded in the initramfs, because the Super-I/O guard is not in the image. It loads after boot (the package /etc/modules-load.d/control-ofc.conf asks for it), where the guard can check the board.' >&2; fi
