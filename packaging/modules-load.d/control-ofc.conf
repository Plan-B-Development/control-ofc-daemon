# Kernel modules for motherboard hardware monitoring (control-ofc-daemon).
#
# CPU temperature modules (coretemp, k10temp) and SMBus adapter modules
# (i2c-i801, i2c-piix4) auto-load via PCI/ACPI device matching on most
# distributions. The modules below are Super I/O chipset drivers that
# expose motherboard fan headers and temperatures — they sit on ISA I/O
# ports without a bus-enumerable trigger, so the kernel cannot auto-load
# them.
#
# Loading a module for a chip that is not present is USUALLY harmless, but not
# always, and this file used to claim otherwise. The old wording was "harmless
# (modprobe exits silently)". Both halves are false on Gigabyte boards with an
# ITE Super-I/O:
#
#   * nct6775 and w83627ehf write a config-mode unlock to 0x2E/0x4E BEFORE they
#     read the device ID. On a board whose secondary Super-I/O sits behind an
#     ITE eSPI-to-LPC bridge, that write latches the bridge into config mode,
#     where it answers in place of the chip behind it. it87 then cannot find the
#     secondary at all. Measured 2026-09-05 on an X870E AORUS MASTER: 3 of 8 fan
#     headers and 3 of 9 temperatures lost, and only a FULL POWER CUT restores
#     them — a reboot does not.
#   * modprobe does not exit silently either. It fails ("could not insert
#     'nct6775': No such device") and does the damage anyway, because the probe
#     writes the port before reporting that it found nothing.
#
# You do not need to act on this. The package ships a guard
# (/usr/lib/modprobe.d/control-ofc-superio.conf) that suppresses those two
# modules on the affected boards and leaves them alone everywhere else, so the
# entries below are safe as they stand. See the Hardware Troubleshooting guide
# if a chip is already hidden.
#
# To disable this file, rename or delete it.
#
# For hardware not covered here, check the GUI's readiness report first
# (the Hardware page) — it identifies the needed module
# without probing the hardware. Last resort, at your own risk (probing can
# upset some chips — see sensors-detect(8); never run it after boot on
# dual-chip Gigabyte boards):
#   sudo sensors-detect

# Nuvoton Super I/O (ASUS, Gigabyte, MSI — very common on modern boards)
nct6775

# ITE Super I/O (Gigabyte, ASRock, some ASUS)
it87

# Winbond/Nuvoton legacy Super I/O (older boards)
w83627ehf

# SATA/SAS drive temperature (not auto-loaded before kernel 6.1)
drivetemp
